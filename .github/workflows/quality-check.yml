# Lint and test the codebase

name: quality-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  quality-check:
    # Do not run for automated release commits (otherwise we would run into a deadlock situation)
    if: ${{ !contains(github.event.head_commit.message, 'chore(release):') }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser test project (vitest browser mode) runs in a real
      # Chromium via Playwright (ADR-0018).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The test step wrote the four-direction round-trip outputs to
      # out/roundtrip/ (ADR-0016); prove they import into real Anki with the
      # same content as the fixtures they came from (Story 1.3.10). The anki
      # package version is pinned to the wire spec (docs/formats/anki.md).
      - name: Verify round-trip outputs against real Anki
        run: |
          pip install anki==26.5
          python scripts/anki-fixtures/compare.py tests/fixtures/anki/corpus/corpus-legacy2-single-deck.apkg out/roundtrip/legacy-to-legacy.apkg
          python scripts/anki-fixtures/compare.py tests/fixtures/anki/corpus/corpus-legacy2-single-deck.apkg out/roundtrip/legacy-to-modern.apkg
          python scripts/anki-fixtures/compare.py tests/fixtures/anki/corpus/corpus-v3-single-deck.apkg out/roundtrip/modern-to-legacy.apkg
          python scripts/anki-fixtures/compare.py tests/fixtures/anki/corpus/corpus-v3-single-deck.apkg out/roundtrip/modern-to-modern.apkg

      - name: Build
        run: pnpm run build

      # The browser bundle must stay free of Node builtins (ADR-0018).
      - name: Check browser bundle
        run: pnpm run check:dist:browser
