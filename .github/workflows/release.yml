# Manual release workflow using semantic-release

name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run in dry-run mode (no actual release)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6.0.10

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm >= 11.5.1, required for npm trusted publishing
          # (OIDC); Node 22's npm 10 fails `npm publish` with ENEEDAUTH.
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser test project (vitest browser mode) runs in a real
      # Chromium via Playwright (ADR-0018).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            pnpm dlx semantic-release --dry-run
          else
            pnpm dlx semantic-release
          fi
